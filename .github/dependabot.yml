# Keeps dependencies and pinned action SHAs up to date. Minor/patch bumps are
# grouped to cut noise; majors are also grouped per-app (reviewed deliberately).
# A few majors are intentionally pinned via `ignore` — they are large, breaking
# migrations we take on by hand, not via auto-bump.
#
# PAUSED: the app is on hold, so every ecosystem is capped at 0 open PRs, which
# stops version updates without losing the groups/ignores below. To resume,
# restore the limits noted in the `paused, was:` comments (or drop the line
# entirely where it says `was: default`).
version: 2
updates:
  # ---- Backend (NestJS) ----
  - package-ecosystem: npm
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 0 # paused, was: 10
    groups:
      api-minor-patch:
        update-types: [minor, patch]
      api-major:
        update-types: [major]
    ignore:
      # Keep @types/node aligned with the pinned Node 24 LTS runtime.
      # (Next even LTS ~Oct 2026 = Node 26 — bump manually then.)
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  # ---- Frontend (React + Vite) ----
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 0 # paused, was: 10
    groups:
      web-minor-patch:
        update-types: [minor, patch]
      web-major:
        update-types: [major]

  # ---- GitHub Actions (keeps SHA pins current; one grouped PR) ----
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0 # paused, was: default
    groups:
      actions:
        update-types: [minor, patch, major]

  # ---- Docker base images ----
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 0 # paused, was: default
    ignore:
      # Pin to Node 24 LTS (matches .nvmrc + package.json engines).
      # (Next even LTS ~Oct 2026 = Node 26 — bump manually then.)
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 0 # paused, was: default
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
